<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puddle Runners</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c0c0e;color:#f4f4f5;font:16px/1.6 system-ui,Segoe UI,Inter,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 6vw}header b{font-size:20px;letter-spacing:.04em}
a.btn{display:inline-block;padding:12px 22px;border-radius:12px;background:#d1fe17;color:#0c0c0e;text-decoration:none;font-weight:700}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:5vw;align-items:center;padding:6vh 6vw}
.hero h1{font-size:clamp(36px,6vw,72px);line-height:1.02;margin:0 0 16px}.hero p{font-size:20px;opacity:.8;margin:0 0 26px}
.hero img,.hero video,figure img,figure video{width:100%;border-radius:20px;display:block;object-fit:cover}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;padding:4vh 6vw}
.card{background:#18181c;border-radius:18px;padding:22px}.card b{color:#d1fe17;font-size:18px}.card p{opacity:.8;margin:6px 0 0}

.end{text-align:center;padding:10vh 6vw}.end h2{font-size:clamp(28px,4vw,48px);margin:0 0 20px}footer{padding:30px 6vw;opacity:.5;font-size:13px}
@media(max-width:800px){.hero{grid-template-columns:1fr}}
</style></head><body>
<header><b>Puddle Runners</b><a class="btn" href="#start">Shop the drop</a></header>
<section class="hero"><div><h1>Puddle Runners</h1><p>Sneakers made for wet city nights.</p><a class="btn" href="#start">Shop the drop</a></div><div><img src="media_0.png" alt=""></div></section>
<section class="cards"><div class=card><b>Grip</b><p>rubber that holds on wet stone</p></div><div class=card><b>Light</b><p>280 g per shoe</p></div><div class=card><b>Clean</b><p>wipes off in seconds</p></div></section>
<section class="gallery"><figure><video src="media_1.mp4" autoplay muted loop playsinline></video></figure><figure><img src="media_2.png" alt=""></figure></section>
<section class="end" id="start"><h2>Sneakers made for wet city nights.</h2><a class="btn" href="#">Shop the drop</a></section>
