[project]
name = "opensfield"
version = "0.1.0"
description = "Open-source Higgsfield rebuild on ComfyUI (#OpenSourceHiggsfield)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Needed only when OPENSFIELD_MODE=comfy (real runs). Mock mode never imports it.
comfy = ["comfy-sdk"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
